plugins {
    id 'com.android.library'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.28.0'
}

group = 'org.philimone.hds.forms'
version = '1.7.1'

android {
    namespace = "org.philimone.hds.forms"

    compileSdk = 35

    defaultConfig {
        minSdk = 26
        targetSdk = 35
        versionCode 15
        versionName "1.7.1"

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }



    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    api 'org.philimone.hds.forms.model:hds-forms-model-lib:1.0.5'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.fragment:fragment-ktx:1.8.8'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'

    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.ibm.icu:icu4j:77.1'

    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"

    implementation "androidx.window:window:1.4.0"
    implementation "androidx.window:window-java:1.4.0"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

signing {
    required {
        (gradle.taskGraph.hasTask("publish") || gradle.taskGraph.hasTask("publishAndReleaseToMavenCentral")) &&
        (project.hasProperty("signing.keyId") || project.hasProperty("signing.gnupg.keyName"))
    }
    if (project.hasProperty("signing.gnupg.keyName")) {
        useGpgCmd()
    }
}

mavenPublishing {
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL, true)

    if (project.hasProperty("signing.keyId") || project.hasProperty("signing.gnupg.keyName")) {
        signAllPublications()
    }

    coordinates("org.philimone.hds.forms", "hds-forms-lib", "1.7.1")

    pom {
        name = 'HDS Forms Library'
        description = 'Android library for dynamic data collection in HDS-Explorer and longitudinal research, providing logic-driven form rendering as native UI components.'
        url = 'https://github.com/philimones-group/hds-forms-lib'
        
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'paulphilimone'
                name = 'Paulo Filimone'
                email = 'paulphilimone@gmail.com'
            }
        }
        scm {
            connection = 'scm:git:github.com/philimones-group/hds-forms-lib.git'
            developerConnection = 'scm:git:ssh://github.com/philimones-group/hds-forms-lib.git'
            url = 'https://github.com/philimones-group/hds-forms-lib'
        }
    }
}
